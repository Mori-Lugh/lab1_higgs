services:
  #Первое хранилище + служебная база Airflow
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      retries: 15

  #Второе хранилище
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db

  #Третье хранилище (совместимо с Amazon S3)
  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-10-15T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  # Инициализация Airflow и создание пользователя
  airflow-init:
    build: .
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create --username admin --password admin --firstname Student --lastname Student --role Admin --email admin@example.com || true
    environment: &airflow_env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__WEBSERVER__SECRET_KEY: lab1-higgs-example-key
      PYTHONPATH: /opt/airflow/dags
    volumes: &airflow_volumes
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./check_results.py:/opt/airflow/check_results.py:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Веб-интерфейс Airflow
  airflow-webserver:
    build: .
    command: webserver
    environment: *airflow_env
    ports:
      - "127.0.0.1:8080:8080"
    volumes: *airflow_volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Планировщик, который выполняет наши DAG
  airflow-scheduler:
    build: .
    command: scheduler
    environment: *airflow_env
    volumes: *airflow_volumes
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      mongo:
        condition: service_started
      minio:
        condition: service_started

volumes:
  postgres_data:
  mongo_data:
  minio_data:
